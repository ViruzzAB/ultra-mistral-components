<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Ultra Mistral</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mistralCobalt: '#0F3D8A',
                        mistralDeep: '#0A2246',
                        mistralRoyal: '#1E40AF',
                        mistralYellow: '#FACC15',
                        mistralGold: '#F59E0B'
                    },
                    fontFamily: {
                        logo: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        .logo-refined { font-family: 'Cinzel', serif; letter-spacing: 0.18em; font-weight: 900; }
        body { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
    </style>
</head>
<body class="bg-transparent font-sans antialiased">
    <footer class="w-full bg-mistralDeep text-white py-10 px-4 sm:px-6 lg:px-8 border-t-4 border-mistralYellow">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            
            <div class="text-center md:text-left space-y-1.5">
                <span class="text-2xl logo-refined text-white block">
                    ULTRA <span class="text-mistralYellow">MISTRAL</span>
                </span>
                <p class="text-xs text-slate-300 italic font-serif">
                    « L'art de la patience, la rigueur du réel, l'appel des cimes. » • <strong>GRAGAMs & ALEX</strong>
                </p>
            </div>

            <div class="flex flex-col items-center md:items-end space-y-1.5 text-xs text-slate-400 font-mono">
                <span class="text-mistralYellow">Marseille-Cassis (47e) → Veni Vici (33K) → UTMB 100M & Diagonale</span>
                <div class="flex items-center gap-3">
                    <span>© 2026 Association ULTRA MISTRAL</span>
                    <a href="https://sites.google.com/view/TON-SITE/console" target="_parent" aria-label="Accès console" class="text-slate-500 hover:text-mistralYellow transition">
                        <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                    </a>
                </div>
            </div>

        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
